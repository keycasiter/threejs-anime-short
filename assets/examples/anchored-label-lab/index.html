<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101619;color:#e7ece8;font:14px/1.5 system-ui,sans-serif}main{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.stage{position:relative;min-width:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.labels>div{pointer-events:auto}.panel{padding:24px;background:#192226;border-left:1px solid #364247}h1{font-size:21px;margin:0 0 8px}p{color:#b8c4c2;margin:8px 0 16px}button{border:1px solid #59696e;border-radius:5px;background:#253238;color:inherit;padding:9px 12px;margin:4px 4px 4px 0;cursor:pointer}.status{height:260px;overflow:auto;margin-top:14px;padding:12px;background:#11191c;border-radius:5px;white-space:pre-wrap;color:#b7c5c3;font-size:11px}.world-tag{padding:5px 10px;border:1px solid #9bc2bd;border-radius:5px;background:#10211edc;color:#e8f4e9;font:600 12px/1.3 ui-monospace,monospace;white-space:nowrap;margin-top:-10px}.world-tag[data-kind="view"]{border-color:#e9bb7d;background:#3b2416e8}.three-annotation{display:flex;align-items:center;gap:10px;max-width:210px;padding:8px 10px;border:1px solid #d8bd88;border-radius:8px;background:#201a13ef;color:#fff0d1;box-shadow:0 6px 22px #0008;margin-left:14px}.three-annotation__text{border:0;margin:0;padding:0;background:transparent;color:inherit;font:inherit;font-weight:650;text-align:left;cursor:pointer}.three-annotation__close{width:24px;height:24px;margin:0;padding:0;border-radius:50%;background:#493625;border-color:#9d7953;font-size:17px;line-height:1}.three-annotation__close:hover{background:#765233}small{display:block;color:#9baaad;margin-top:20px}@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.panel{border-left:0;border-top:1px solid #364247;padding:14px}.stage{min-height:54vh}}
