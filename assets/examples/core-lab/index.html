<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Three.js · 核心能力整场接线</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dce4df;color:#243e38;font:12px system-ui,sans-serif}canvas{display:block;touch-action:none}aside{position:fixed;top:16px;left:16px;width:238px;padding:18px;background:#fafbf3ed;border:1px solid #b8c9bc;border-radius:5px}details>summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none}details>summary::after{content:" ＋"}details[open]>summary::after{content:" −"}aside:has(details:not([open])){width:auto;max-width:calc(100vw - 32px);padding:11px 14px}small{letter-spacing:1.5px;font-size:9px}h1{font-size:20px;margin:9px 0 12px}p{line-height:1.65;font-size:11px}label{display:block;margin-top:10px}select,input{width:100%;margin-top:5px}select{padding:6px;background:#f7f9f1;border:1px solid #b1c1b7;color:inherit}button{padding:8px 9px;margin:8px 3px 0 0;background:#355d51;color:#fff;border:0;border-radius:3px;cursor:pointer}pre{white-space:pre-wrap;font:9px/1.5 monospace;max-height:16vh;overflow:auto}footer{position:fixed;right:18px;bottom:18px;pointer-events:none;font-size:10px}@media(max-width:650px){aside{width:190px;padding:12px;left:8px;top:8px}h1{font-size:17px}}</style>
<!-- Supply matching Three.js r187 build/ and examples/jsm/ at ./vendor/. -->
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script></head><body>
<aside><details id="workbench"><summary>场景工作台</summary><small>FORM / SPACE / LIGHT</small><h1>同一世界，三条接力</h1><p>曲面壳、非圆截面与连续连接进入完整区域；道路、承托、邻件与材光共享实际数据。</p>
<label for="configuration">空间结构</label><select id="configuration"><option value="grid">轴网与四个区域</option><option value="ring">环路与分支区域</option><option value="terraced">上下层与实际连接</option></select>
<label for="look">材光目标</label><select id="look"><option value="pbr">PBR / 材料与环境响应</option><option value="toon">分段受光 / 金属反射</option></select>
<label for="formation">形成响应 <input id="formation" type="checkbox" checked style="width:auto;vertical-align:middle"></label>
<label for="environment">反射来源</label><select id="environment"><option value="world">完整世界 / 静态捕获</option><option value="sky">渐变天空</option></select>
<label for="view">观察任务</label><select id="view"><option value="overview">全貌</option><option value="region">代表区域</option><option value="connection">结构与接点</option><option value="reverse">互补背面</option><option value="level-link" disabled>层间接口</option></select>
<label for="roofLift">曲壳结构抬升 / m</label><input id="roofLift" type="range" min="0" max=".8" step=".1" value="0">
<button id="reset">复位镜头</button><button id="play">暂停</button><button id="invalid">无效重建</button><button id="cycle">重建10次</button>
<button id="captureFail1">捕获1次后失败</button><button id="captureFail2">捕获2次后失败</button>
<pre id="status" aria-live="polite">加载中</pre></details></aside><footer>纯代码几何 · 360°环绕 · 缩放 · 源码与画面同源</footer>
<script type="module" src="./main.mjs"></script></body></html>
