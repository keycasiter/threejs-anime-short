<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>活动关系 · 作业链与院落</title>
<style>*{box-sizing:border-box}body{margin:0;color:#243e38;background:#dce4df;font:12px/1.6 system-ui,sans-serif}canvas{display:block;touch-action:none}aside{position:fixed;top:16px;left:16px;width:240px;padding:15px;background:#fafbf3ee;border:1px solid #b8c9bc;border-radius:4px}summary,button{cursor:pointer}summary{font-weight:600}h1{font-size:20px;margin:10px 0}label{display:block;margin-top:10px}select,input{width:100%;margin-top:4px}select{padding:6px;color:inherit;background:#f7f9f1;border:1px solid #b1c1b7}button{padding:7px 10px;border:0;border-radius:3px;background:#355d51;color:white;margin:9px 3px 0 0}pre{white-space:pre-wrap;font:10px/1.5 monospace;max-height:20vh;overflow:auto}body.clean aside,body.clean footer{display:none}aside:has(details:not([open])){width:auto}footer{position:fixed;right:16px;bottom:12px;pointer-events:none;font-size:11px}</style>
